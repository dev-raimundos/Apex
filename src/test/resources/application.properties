spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/apex}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

jwt.issuer=${JWT_ISSUER:Apex}
jwt.audience=${JWT_AUDIENCE:Apex.Clients}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:15}
jwt.signing-key=${JWT_SIGNING_KEY:test-signing-key-please-override-32bytes+}
